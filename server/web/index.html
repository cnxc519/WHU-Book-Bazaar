<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f8a5f">
<title>WHU二手书市</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏（登录后显示） -->
  <header id="topbar" class="hidden">
    <div id="topbar-title">WHU二手书市</div>
    <button id="bell" class="hidden" onclick="go('#/notifications')">🔔<span id="bell-badge" class="badge hidden"></span></button>
  </header>

  <!-- 视图容器 -->
  <main id="view"></main>

  <!-- 底部 Tab（登录后显示） -->
  <nav id="tabbar" class="hidden">
    <a data-r="#/browse" onclick="go('#/browse')">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>书市</span></a>
    <a data-r="#/sell" onclick="go('#/sell')">
      <svg viewBox="0 0 24 24"><path d="M12 3v11M7.5 7.5L12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>卖书</span></a>
    <a data-r="#/inbox" onclick="go('#/inbox')">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>消息</span><span id="tab-msg-badge" class="badge hidden"></span></a>
    <a data-r="#/invite" onclick="go('#/invite')">
      <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 11l8 5 8-5M12 3v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>邀请</span></a>
    <a data-r="#/me" onclick="go('#/me')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span></a>
  </nav>

  <!-- 全局提示 -->
  <div id="toast" class="hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
