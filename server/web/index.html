<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f8a5f">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="/appicon.png">
<title>WHU二手书市</title>
<link rel="stylesheet" href="style.css?v=138">
</head>
<body>
<div id="app">
  <!-- 顶部栏（登录后显示） -->
  <header id="topbar" class="hidden">
    <div id="topbar-title">WHU二手书市</div>
    <button id="bell" class="hidden" onclick="go('#/notifications')">🔔<span id="bell-badge" class="badge hidden"></span></button>
  </header>

  <!-- 视图容器 -->
  <main id="view"></main>

  <!-- 底部模式切换（想买书/想卖书，登录后显示；Tab 内容由 app.js 按模式动态渲染） -->
  <div id="modewrap" class="hidden">
    <button id="mode-buy" onclick="setMode('buy')">🛒 想买书</button>
    <button id="mode-sell" onclick="setMode('sell')">📚 想卖书</button>
  </div>
  <nav id="tabbar" class="hidden"></nav>

  <!-- 全局提示 -->
  <div id="toast" class="hidden"></div>
</div>
<script src="app.js?v=138"></script>
</body>
</html>
